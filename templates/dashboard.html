{% extends "_base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<header>
  <h1>Dashboard</h1>
</header>

<main>
  <section class="tiles" id="tiles"></section>

  <h2 class="section-title">Ventas de los ultimos 7 dias</h2>
  <section id="sparkline" class="sparkline-card"></section>

  <div class="dashboard-columns">
    <div>
      <h2 class="section-title">Mas vendidos (30 dias)</h2>
      <section id="top-products"></section>
    </div>
    <div>
      <h2 class="section-title">Stock bajo</h2>
      <section id="low-stock"></section>
    </div>
  </div>

  <h2 class="section-title">Ultimas ventas</h2>
  <section id="recent-sales"></section>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
