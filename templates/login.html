<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Ingresar - Tengo Stock</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
<main class="login-card">
  <div class="login-brand">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M13 3 L6 13 H11 L10 21 L18 10 H13 L13 3 Z" fill="currentColor"/></svg>
    <span>Tengo Stock</span>
  </div>
  <form method="post" action="/login" class="login-form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>Usuario
      <input name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" autofocus required>
    </label>
    <label>Clave
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <button type="submit" class="btn-primary">Ingresar</button>
  </form>
</main>
</body>
</html>
