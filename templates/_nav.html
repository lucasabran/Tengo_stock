<nav class="topnav">
  <a href="{{ nav_items[0].url if nav_items else '/' }}" class="topnav-brand">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M13 3 L6 13 H11 L10 21 L18 10 H13 L13 3 Z" fill="currentColor"/></svg>
    Tengo Stock
  </a>
  <div class="topnav-links">
    {% for item in nav_items %}
    <a href="{{ item.url }}" class="{% if active == item.key %}active{% endif %}">{{ item.label }}</a>
    {% endfor %}
  </div>
  {% if current_user %}
  <div class="topnav-user">
    <a href="/cuenta" class="{% if active == 'cuenta' %}active{% endif %}" title="Mi cuenta">{{ current_user.full_name or current_user.username }}</a>
    <form method="post" action="/logout"><button type="submit" title="Cerrar sesion">Salir</button></form>
  </div>
  {% endif %}
</nav>
