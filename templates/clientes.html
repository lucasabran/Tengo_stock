{% extends "_base.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<header>
  <h1>Clientes</h1>
  <input id="search" type="search" placeholder="Buscar por nombre, telefono, mail o documento...">
  <div class="filters-row">
    <select id="filter-office"><option value="">Todas las oficinas</option></select>
    <select id="filter-type">
      <option value="">Minoristas y mayoristas</option>
      <option value="minorista">Minoristas</option>
      <option value="mayorista">Mayoristas</option>
    </select>
    <input id="filter-product" type="search" placeholder="Compro el producto...">
    <a id="export-link" href="/api/customers/export.csv">Exportar clientes</a>
  </div>
</header>

<main>
  <section id="list"></section>
</main>

<button id="fab-add" title="Agregar cliente">+</button>

<dialog id="form-dialog">
  <form id="customer-form">
    <h2 id="form-title">Nuevo cliente</h2>
    <label>Nombre
      <input name="name" id="f-name" required>
    </label>
    <label>Telefono
      <input name="phone" id="f-phone">
    </label>
    <label>Email
      <input name="email" id="f-email" type="email">
    </label>
    <label>Documento
      <input name="doc_number" id="f-doc">
    </label>
    <label>Domicilio
      <input id="f-address" placeholder="Calle y numero">
    </label>
    <div class="field-row">
      <label>Localidad
        <input id="f-city">
      </label>
      <label>Provincia
        <input id="f-province">
      </label>
    </div>
    <div class="field-row">
      <label>Oficina
        <select id="f-office"><option value="">Sin asignar</option></select>
      </label>
      <label>Tipo de cliente
        <select id="f-type">
          <option value="minorista">Minorista</option>
          <option value="mayorista">Mayorista</option>
        </select>
      </label>
    </div>
    <label>Nota
      <textarea name="note" id="f-note" rows="2"></textarea>
    </label>
    <div id="form-error" class="error hidden"></div>
    <div class="form-actions">
      <button type="button" id="form-cancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="purchases-dialog">
  <form method="dialog" class="confirm-dialog-form">
    <h2 id="purchases-title">Compras</h2>
    <div id="purchases-body"></div>
    <div class="form-actions"><button type="submit" value="ok">Cerrar</button></div>
  </form>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='clientes.js') }}"></script>
{% endblock %}
