<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Stock</h1>
  <input id="search" type="search" placeholder="Buscar por SKU o nombre...">
  <div class="import-row">
    <button id="btn-import" type="button">Importar stock (Excel/CSV)</button>
    <a href="/api/products/template.csv">Descargar plantilla</a>
  </div>
  <input type="file" id="import-file" accept=".csv,.xlsx,.xlsm" class="hidden">
</header>

<main>
  <section id="list"></section>
</main>

<button id="fab-add" title="Agregar producto">+</button>

<dialog id="form-dialog">
  <form id="product-form">
    <h2 id="form-title">Nuevo producto</h2>
    <label>SKU
      <input name="sku" id="f-sku" required>
    </label>
    <label>Nombre
      <input name="name" id="f-name" required>
    </label>
    <label>Precio
      <input name="price" id="f-price" type="number" step="0.01" min="0" required>
    </label>
    <label>Cantidad
      <input name="quantity" id="f-quantity" type="number" step="1" min="0" required>
    </label>
    <label>Descripcion
      <textarea name="description" id="f-description" rows="3"></textarea>
    </label>
    <div id="form-error" class="error hidden"></div>
    <div class="form-actions">
      <button type="button" id="form-cancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
