{% extends "_base.html" %}
{% block title %}Nueva venta{% endblock %}
{% block content %}
<header>
  <h1>Nueva venta</h1>
</header>

<main>
  <form id="sale-form" class="sale-form">
    <div class="field-row">
      <label>Canal
        <div class="inline-select">
          <select id="f-channel" required></select>
          <button type="button" id="btn-new-channel">+ nuevo</button>
        </div>
      </label>
      <label>Cliente
        <div class="inline-select">
          <select id="f-customer"><option value="">Sin cliente</option></select>
          <button type="button" id="btn-new-customer">+ nuevo</button>
        </div>
      </label>
    </div>

    <label>Buscar producto
      <input id="product-search" type="search" placeholder="SKU o nombre...">
    </label>
    <div id="product-results" class="product-results hidden"></div>

    <table class="cart-table">
      <thead>
        <tr><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr>
      </thead>
      <tbody id="cart-body"></tbody>
    </table>
    <div id="cart-empty" class="empty">Todavia no agregaste productos.</div>

    <div class="field-row">
      <label>Descuento
        <input id="f-discount" type="number" step="0.01" min="0" value="0">
      </label>
      <label>Forma de pago
        <select id="f-payment">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Mercado Pago">Mercado Pago</option>
          <option value="Cuenta corriente">Cuenta corriente</option>
          <option value="Otro">Otro</option>
        </select>
      </label>
      <label>Moneda
        <select id="f-currency">
          <option value="ARS">Pesos ($)</option>
          <option value="USD">Dolares (US$)</option>
        </select>
      </label>
    </div>
    <label>Nota
      <textarea id="f-note" rows="2"></textarea>
    </label>

    <div class="totals">
      <div>Subtotal: <span id="total-subtotal">$0</span></div>
      <div>Total: <span id="total-total">$0</span></div>
    </div>

    <div id="form-error" class="error hidden"></div>
    <button type="submit" class="btn-primary">Registrar venta</button>
  </form>
</main>

<dialog id="customer-dialog">
  <form id="customer-form">
    <h2>Nuevo cliente</h2>
    <label>Nombre
      <input id="c-name" required>
    </label>
    <label>Telefono
      <input id="c-phone">
    </label>
    <label>Email
      <input id="c-email" type="email">
    </label>
    <div class="form-actions">
      <button type="button" id="customer-cancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="channel-dialog">
  <form id="channel-form">
    <h2>Nuevo canal</h2>
    <label>Nombre
      <input id="ch-name" placeholder="Ej: ML - Cuenta Norte" required>
    </label>
    <label>Tipo
      <select id="ch-type">
        <option value="mercadolibre">Mercado Libre</option>
        <option value="tiendanube">Tiendanube</option>
        <option value="instagram">Instagram</option>
        <option value="mostrador">Mostrador</option>
        <option value="other">Otro</option>
      </select>
    </label>
    <div class="form-actions">
      <button type="button" id="channel-cancel">Cancelar</button>
      <button type="submit">Guardar</button>
    </div>
  </form>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='venta_nueva.js') }}"></script>
{% endblock %}
